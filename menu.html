<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menú | El Buen Sabor</title>
  <meta name="description" content="La carta de El Buen Sabor ahora está en la página de inicio.">
  <link rel="canonical" href="https://misiomis.github.io/burguer_truck/">
  <!--
    Compatibilidad: la carta se unificó en index.html. Esta página lleva a la sección equivalente
    sin dejar una entrada extra en el historial (location.replace). Nunca vuelve a menu.html: no hay bucles.
  -->
  <script>
    (function () {
      var map = { '': '#carta', '#menu-main': '#carta', '#menu-order': '#order', '#cat-burger': '#hamburguesas', '#cat-combo': '#carta', '#cat-drink': '#carta' };
      var h = location.hash;
      var target = Object.prototype.hasOwnProperty.call(map, h) ? map[h] : (/^#[a-z0-9-]+$/.test(h) ? h : '#carta');
      location.replace('./' + location.search + target);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=./#carta"></noscript>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/icono-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="contenido" class="container simple-page">
    <p class="eyebrow">El Buen Sabor</p>
    <h1>El menú ahora está en el inicio</h1>
    <p>Te llevamos a la carta. Si no pasa nada, tocá el botón.</p>
    <p><a class="btn btn--primary" href="./#carta">Ver el menú</a></p>
  </main>
</body>
</html>
